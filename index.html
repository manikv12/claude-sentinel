<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Sentinel</title>
  </head>
  <body>
    <div id="root">
      <!-- Simple loading screen - shows before React loads -->
      <style>
        html, body {
          margin: 0;
          padding: 0;
          overflow: hidden;
          border-radius: 12px;
          scrollbar-width: none;
          -ms-overflow-style: none;
        }
        
        html::-webkit-scrollbar, body::-webkit-scrollbar {
          display: none;
        }
        
        #root {
          overflow: hidden;
          border-radius: 12px;
        }
        
        .loading-screen {
          background: hsl(222.2 84% 4.9%);
          color: hsl(210 40% 98%);
          min-height: 100vh;
          width: 100vw;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          border-radius: 12px;
          position: fixed;
          top: 0;
          left: 0;
          z-index: 9999;
          opacity: 1;
          transition: opacity 0.8s ease-out;
        }
        
        .loading-screen.fade-out {
          opacity: 0;
          pointer-events: none;
        }
        
        .loading-logo {
          display: flex;
          align-items: center;
          gap: 1rem;
          margin-bottom: 2rem;
        }
        
        .loading-icon {
          width: 3rem;
          height: 3rem;
          border-radius: 0.5rem;
          display: flex;
          align-items: center;
          justify-content: center;
          position: relative;
        }
        
        .loading-icon img {
          width: 100%;
          height: 100%;
          border-radius: 0.5rem;
        }
        
        .loading-title {
          font-size: 2rem;
          font-weight: 600;
          color: hsl(210 40% 98%);
        }
        
        .loading-text {
          font-size: 1.125rem;
          color: rgba(255, 255, 255, 0.7);
          animation: fade 2s ease-in-out infinite;
        }
        
        @keyframes fade {
          0%, 100% { opacity: 0.7; }
          50% { opacity: 1; }
        }
      </style>
      <div class="loading-screen" id="loading-screen">
        <div class="loading-logo">
          <div class="loading-icon">
            <img src="/build/icon.png" alt="Claude Sentinel" />
          </div>
          <h1 class="loading-title">Claude Sentinel</h1>
        </div>
        <p class="loading-text">Loading...</p>
      </div>
      
      <script>
        // Keep loading screen for random 10-30 seconds
        function hideLoadingScreen() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            // Start fade out animation
            loadingScreen.classList.add('fade-out');
            
            // Remove from DOM after animation completes
            setTimeout(() => {
              loadingScreen.remove();
            }, 800);
          }
        }
        
        // Generate random delay between 10-30 seconds (10000-30000 ms)
        const randomDelay = Math.floor(Math.random() * 20000) + 10000;
        
        // Hide loading screen after random delay
        setTimeout(hideLoadingScreen, randomDelay);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
