<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="50%" style="stop-color:#111111"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#1d4ed8"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
    <radialGradient id="dotGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.3"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="113" fill="url(#bgGradient)"/>
  
  <!-- Pulsation rings (more spaced out) -->
  <circle cx="256" cy="256" r="46" fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="2"/>
  <circle cx="256" cy="256" r="102" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>
  <circle cx="256" cy="256" r="158" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Pulse waveform (thinner wave) -->
  <path d="M 61 256 L 128 256 L 154 307 L 179 179 L 215 384 L 256 102 L 297 384 L 333 256 L 451 256" 
        stroke="url(#pulseGradient)" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"
        filter="url(#glow)"/>
</svg>